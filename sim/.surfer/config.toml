# Surfer settings for this workspace, arranged to feel closer to Vivado xsim.
# Surfer picks this up when started from sim/, which `make wave VIEWER=surfer` does.
autoreload_files = "Always"   # refresh the open window when a run rewrites wave.fst

[layout]
fill_high_values = false      # outline instead of a filled block, like xsim

[shortcuts]
zoom_in = ["Plus", "Equals", "Command+Equals"]
zoom_out = ["Minus", "Command+Minus"]
ui_zoom_out = []
zoom_to_fit = ["Shift+F", "Command+0"]
reload_waveform = ["R", "F5"]
